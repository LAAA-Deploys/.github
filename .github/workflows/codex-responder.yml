# The Codex responder (Glen, 10/27/2026): answers a Codex review finding on a PR that no chat owns,
# a PR opened by a bot (Dependabot, a routine). A PR a chat opened in the desktop app is answered by
# that chat, which the app wakes through Auto-fix; this covers the rest, so no PR sits on an open
# thread until the gate tags Glen an hour later. One run per finding: fix a real defect on the PR
# branch and push (Codex reviews the push, the gate re-evaluates), or reply why it is not one; then
# resolve the thread. Replies and the resolve are made as Glen with the watcher's fine-grained token
# for the repo's owner (GH_TOKEN below); the push is the Claude GitHub App's. Claude runs on Glen's
# subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`), never an API key.
#
# Called from each gated repo's `.github/workflows/codex-responder.yml` on
# pull_request_review_comment (created) when the comment is Codex's, the PR's author is a bot and the
# comment starts a thread; the caller pins this file to a commit SHA of this repo, like the gate.
name: codex-responder
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      WATCHER_TOKEN_USER:
        required: false
      WATCHER_TOKEN_ORG:
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
concurrency:
  group: codex-responder-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        env:
          GH_TOKEN: ${{ github.repository_owner == 'LAAA-Deploys' && secrets.WATCHER_TOKEN_ORG || secrets.WATCHER_TOKEN_USER }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "chatgpt-codex-connector[bot]"
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(pip:*)"
          prompt: |
            You are answering one Codex code-review finding on pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. The PR was opened by ${{ github.event.pull_request.user.login }}, a bot,
            so no chat owns it; you do. The checkout is the PR branch `${{ github.event.pull_request.head.ref }}`.

            The finding (review comment ${{ github.event.comment.id }}, node ${{ github.event.comment.node_id }},
            on `${{ github.event.comment.path }}`):

            ${{ github.event.comment.body }}

            Do this, in order:
            1. Read the PR diff (`gh pr diff ${{ github.event.pull_request.number }}`) and the file the finding names.
               Decide whether the finding is a real defect introduced or exposed by this PR. A P0 or P1 that is
               real blocks the merge; a P2 or P3 is fixed when it is a real defect or a clearly correct, small,
               in-scope improvement, and otherwise answered.
            2. If it is real: make the smallest correct fix on this branch, run the repository's own tests if it
               has any (read its README or package.json to find them), commit with a one-line message that names
               the finding, and push to the PR branch. Never force-push, never touch another branch, never change
               files the finding does not concern.
            3. Reply on the finding's thread as a teammate would, in one to three plain sentences: what you changed
               and why, or why it is not a defect. Use
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/${{ github.event.comment.id }}/replies -f body='...'`.
               Say "Fixed" only after the push succeeded; otherwise say what really happened.
            4. Resolve the thread: find its id with
               `gh api graphql -f query='query{repository(owner:"${{ github.repository_owner }}",name:"${{ github.event.repository.name }}"){pullRequest(number:${{ github.event.pull_request.number }}){reviewThreads(first:100){nodes{id isResolved comments(first:1){nodes{databaseId}}}}}}}'`
               (the thread whose first comment's databaseId is ${{ github.event.comment.id }}), then
               `gh api graphql -f query='mutation{resolveReviewThread(input:{threadId:"<id>"}){thread{isResolved}}}'`.
            5. Stop. Do not open a PR, do not merge, do not comment anywhere else, and do not answer any other
               finding: each gets its own run.

            If GH_TOKEN is missing or a command is refused, say so in your final message and stop without guessing.
