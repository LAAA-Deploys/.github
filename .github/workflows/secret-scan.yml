name: secret-scan

# Secret scan, copied from laaa-agent-config (10/26/2026), itself from la-property-mcp (LAAA-AI-Prompts without its SHA-256
# fixture-hash allowlist; this repo has no hash fixtures, and a 64-hex value here
# could be a real key).
#
# Scans only the commits a PR actually introduces (base..head), so it never
# re-flags secrets that are already committed to history (that is a separate,
# already-tracked rotation, not something this check can or should re-litigate
# on every unrelated PR). It exists to stop the NEXT hardcoded credential
# before it merges.
#
# Hard requirement: this check must never print a matched secret value, in
# logs or anywhere else. It reports file, line, and which rule matched only.
# gitleaks' --redact flag (default 100%) redacts secrets from stdout; we
# deliberately do not write or upload a separate report file/artifact, so
# there is no second surface that could carry an unredacted value.
#
# Trusted-base execution (closes a PR-review finding, both Codex and Bugbot,
# independently): this runs on `pull_request_target`, so the workflow
# DEFINITION always comes from the protected base branch -- a PR cannot edit
# this file to neuter its own scan and still publish success under the required
# `secret-scan` status name. The PR's tree is checked out only as inert data
# under the isolated `pr/` path for gitleaks to read; nothing from the PR
# (scripts, actions, dependencies, hooks, or configuration) is ever executed.
# actions/checkout v7 deliberately refuses pull-request heads from private
# forks under `pull_request_target` unless `allow-unsafe-pr-checkout: true` is
# explicit. We opt in only to reading that untrusted tree as isolated data.
# The native Actions check is deliberately named `secret-scan-runner`, while a
# commit status named exactly `secret-scan` is published to the event's exact
# PR head SHA. This bridge is required because `pull_request_target` itself runs
# in the default-branch context, while branch protection evaluates the latest
# PR head. `statuses: write` is the only write grant; no repository secrets are
# exposed to the job, and `persist-credentials: false` leaves no reusable token
# in the untrusted checkout.
#
# Suppression-resistant: a PR must not be able to turn this required check
# green while introducing a secret. gitleaks otherwise honors a repo-supplied
# `.gitleaks.toml`, a `.gitleaksignore`, and inline `gitleaks:allow` comments,
# all of which are PR-controlled content. So we (a) reject any PR whose tree
# contains a gitleaks config/ignore file (this repo has none and needs none),
# and (b) run with --ignore-gitleaks-allow so inline allow comments cannot
# suppress a finding. If a trusted gitleaks config is ever genuinely
# required, it must be added deliberately here as a CODEOWNER-reviewed
# change, not shipped by a PR.
#
# Attribute-resistant: `.gitattributes` is also PR-controlled and can label a
# secret-bearing path as binary. Without `--text`, Git then omits the file's
# contents from `git log -p`, so gitleaks never receives the secret. The scan's
# Git log options force text diffs for every path, regardless of attributes.
#
# Default-allowlist-resistant: gitleaks 8.18.4's embedded default config skips
# broad path classes including lockfiles, PDFs, SVGs, binaries, and vendor
# directories. A PR author could otherwise hide a real credential there. The
# job downloads the exact v8.18.4 upstream config, verifies its pinned SHA-256,
# removes only its single global path-allowlist block, and explicitly supplies
# that trusted config to every canary and real scan. A package-lock canary proves
# at runtime that the former blanket path exclusion is actually disabled. The
# config path is established from RUNNER_TEMP after the runner starts and then
# exported through GITHUB_ENV for subsequent steps; the runner context is not
# available in job-level expressions during workflow validation.
#
# Scanner-integrity canary (closes a Codex finding): gitleaks v8.30.1 is a
# known-broken release upstream (gitleaks/gitleaks#2170) that silently
# detects nothing -- exit 0 on real GitHub PATs, AWS keys, Slack tokens, and
# private keys. Pinned here to v8.18.4 instead, confirmed working by direct
# test against planted secrets of exactly those types. To catch any future
# regression of this class (not just this one CVE-shaped bug), the job
# self-tests the pinned binary against synthetic secrets it generates itself,
# in an isolated temp directory never derived from PR content. Each named
# secret class is asserted independently before the job trusts the binary's
# verdict on the real PR range.
#
# Commit-range validation (closes a Bugbot finding, confirmed by direct
# test): gitleaks does not reliably fail closed on an invalid or empty
# commit range -- an empty BASE_SHA, or two SHAs that don't resolve to
# commits, both silently produce "no leaks found" / exit 0, even though
# gitleaks logs a "fatal: Invalid revision range" line to stderr in the
# invalid-SHA case. So this job explicitly validates both SHAs are
# well-formed and resolve to real commits in the checkout before ever
# invoking gitleaks, and separately fails if gitleaks' own stderr shows a
# git error, as defense in depth against range-resolution failure modes not
# enumerated here.
#
# Merge-commit coverage (closes exact-head Codex findings, reproduced
# independently): plain `git log -p base..head` omits merge diffs, so a secret
# added only during conflict resolution could be present at HEAD but absent
# from gitleaks' input. A first-parent merge diff catches that secret but also
# reclassifies unchanged base-side content as a PR addition. `remerge` recreates
# a two-parent automatic merge and diffs it against the committed resolution,
# exposing resolution-only changes without re-scanning content inherited from
# the base. Git does not remerge octopus commits, so the range validator rejects
# merge commits with any parent count other than two rather than scanning them
# incompletely.

on:
  pull_request_target:
    branches: [master]

permissions:
  contents: read
  statuses: write

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan-runner:
    name: secret-scan-runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending required status on the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload="$(printf \
            '{"state":"pending","context":"secret-scan","description":"Secret scan is running","target_url":"%s"}' \
            "$RUN_URL")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            >/dev/null
          echo "OK: published pending secret-scan status to the exact PR head."

      - name: Install gitleaks 8.18.4 (confirmed-working pin, checksum-verified)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.18.4"
          GITLEAKS_DEFAULT_CONFIG_SHA256="b94aad1d0f105e4d7cb230872461705a4b04a7743c656836144ae6853cb33e1b"
          GITLEAKS_CONFIG="$RUNNER_TEMP/gitleaks-8.18.4-no-global-path-allowlist.toml"
          export GITLEAKS_CONFIG
          printf 'GITLEAKS_CONFIG=%s\n' "$GITLEAKS_CONFIG" >> "$GITHUB_ENV"
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          cd "$install_dir"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

          # The embedded default config globally ignores entire path classes.
          # Start from the exact upstream config for this pinned binary, verify
          # it independently, and remove only that one top-level block. Rule-
          # specific allowlists remain intact.
          curl -sSLo gitleaks-default.toml \
            "https://raw.githubusercontent.com/gitleaks/gitleaks/v${GITLEAKS_VERSION}/config/gitleaks.toml"
          printf '%s  %s\n' "$GITLEAKS_DEFAULT_CONFIG_SHA256" gitleaks-default.toml | sha256sum -c -
          awk '
            BEGIN { dropping = 0; removed = 0 }
            /^\[allowlist\]$/ && removed == 0 { dropping = 1; removed = 1; next }
            dropping && /^$/ { dropping = 0; next }
            !dropping { print }
            END { if (removed != 1) exit 42 }
          ' gitleaks-default.toml > "$GITLEAKS_CONFIG"
          test -s "$GITLEAKS_CONFIG"
          grep -q '^\[\[rules\]\]$' "$GITLEAKS_CONFIG"
          if grep -q '^\[allowlist\]$' "$GITLEAKS_CONFIG"; then
            echo "::error::trusted gitleaks config still contains the prohibited global allowlist"
            exit 1
          fi

          python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" "$GITLEAKS_CONFIG"
          echo "OK: trusted gitleaks config is checksum-verified, parses, and has no global path allowlist."

      - name: Scanner-integrity canary (prove the pinned binary actually detects secrets right now)
        run: |
          set -euo pipefail
          canary_dir="$(mktemp -d)"
          trap 'rm -rf "$canary_dir"' EXIT

          # Synthetic, job-generated content only -- never derived from the
          # PR's checkout. Covers the same secret classes named in the
          # upstream regression report.
          printf 'GH_TOKEN = "ghp_%s%s"\n' \
            'aBcDeFgHiJkLmNoPqR' 'sTuVwXyZ0123456789' \
            > "$canary_dir/github-pat.txt"
          printf 'AWS_KEY = "%s%s"\n' \
            'AKIA' 'ABCDEFGHIJKLMNOP' \
            > "$canary_dir/aws-key.txt"
          printf 'MC_KEY = "%s%s"\n' \
            'abcdef0123456789' 'abcdef0123456789-us7' \
            > "$canary_dir/mailchimp-key.txt"
          printf 'GH_TOKEN = "ghp_%s%s"\n' \
            'aBcDeFgHiJkLmNoPqR' 'sTuVwXyZ0123456789' \
            > "$canary_dir/package-lock.json"
          # A Google API key sitting in ordinary prose, in a MARKDOWN file. A
          # live Maps key sat in two operations handoff docs from March 2026
          # until 2026-08-19, and the only key check anyone could name is
          # check_bov_site.py's, which scans emitted HTML and structurally
          # cannot see a doc. This canary asserts the class and the file type
          # the miss actually happened in, so "the scanner would catch that"
          # stops being an assumption.
          printf 'Google Maps API key: `%s%s`\n' \
            'AIza' 'SyA1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q' \
            > "$canary_dir/google-key-in-a-doc.md"
          echo "this file has no secrets in it" > "$canary_dir/clean.txt"

          assert_detected() {
            local label="$1" source="$2"
            if gitleaks detect --no-git --source "$source" --config "$GITLEAKS_CONFIG" --redact --no-banner >/dev/null 2>&1; then
              echo "::error::scanner-integrity canary FAILED: the pinned gitleaks binary did not detect the planted $label pattern. Do not trust this scan; the gate is not functioning. (This is exactly the gitleaks/gitleaks#2170 failure class.)"
              return 1
            fi
            echo "OK: independently detected the planted $label pattern."
          }

          assert_detected "GitHub PAT" "$canary_dir/github-pat.txt"
          assert_detected "AWS key" "$canary_dir/aws-key.txt"
          assert_detected "Mailchimp key" "$canary_dir/mailchimp-key.txt"
          assert_detected "credential in a formerly globally allowlisted package-lock path" "$canary_dir/package-lock.json"
          assert_detected "Google API key in a markdown doc" "$canary_dir/google-key-in-a-doc.md"

          if ! gitleaks detect --no-git --source "$canary_dir/clean.txt" --config "$GITLEAKS_CONFIG" --redact --no-banner >/dev/null 2>&1; then
            echo "::error::scanner-integrity canary FAILED: the pinned gitleaks binary flagged a file with no secrets. Refusing to trust a scanner with an unexplained false-positive on its own self-test."
            exit 1
          fi
          echo "OK: canary confirms the scanner is not flagging clean content."

      - name: Checkout the PR's tree as isolated data (trusted workflow, untrusted content)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin the clone to the trusted base repository. With fetch-depth 0,
          # checkout v7 fetches every base branch and its history before a
          # targeted head-SHA fetch, so the event's base SHA is in this same
          # object database even when the PR branch is behind the target.
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Assert the checkout matches the expected exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git -C pr rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_HEAD" ]; then
            echo "::error::checked-out HEAD ($actual) does not match the event's head SHA ($EXPECTED_HEAD) -- stale or superseded run, refusing to scan"
            exit 1
          fi
          echo "OK: checkout is exactly $actual"

      - name: Reject PR-introduced gitleaks suppressions
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # gitleaks auto-discovers `.gitleaks.toml` and `.gitleaksignore` from
          # the scanned tree; a PR could ship either to allowlist its own secret
          # and still pass. This repo has neither, so any presence is a bypass
          # attempt. Fail the gate if one appears. (Inline `gitleaks:allow`
          # comments are neutralized separately by --ignore-gitleaks-allow.)
          # Inspect the committed Git tree rather than walking the checkout.
          # `git ls-tree` reports regular files and symlinks alike. Parse its
          # NUL-delimited names without ever echoing attacker-controlled paths.
          tree_names="$(mktemp)"
          trap 'rm -f "$tree_names"' EXIT
          git -C pr ls-tree -rz --name-only "${EXPECTED_HEAD}^{tree}" > "$tree_names"

          suppression_count=0
          while IFS= read -r -d '' path; do
            case "${path##*/}" in
              .gitleaks.toml|.gitleaksignore)
                suppression_count=$((suppression_count + 1))
                ;;
            esac
          done < "$tree_names"

          if [ "$suppression_count" -ne 0 ]; then
            echo "::error::secret-scan gate: PR tree contains $suppression_count prohibited gitleaks suppression file(s)"
            exit 1
          fi
          echo "OK: no gitleaks suppression files present."

      - name: Validate the commit range before trusting any scan result
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          validate_sha() {
            local name="$1" sha="$2"
            if [ -z "$sha" ]; then
              echo "::error::$name is empty"; return 1
            fi
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$name is not a 40-character hex SHA"; return 1
            fi
            if ! git -C pr cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::$name does not resolve to a commit in this checkout: $sha"; return 1
            fi
            echo "OK: $name resolves to a real commit"
          }
          validate_sha BASE_SHA "$BASE_SHA"
          validate_sha HEAD_SHA "$HEAD_SHA"

          # `--diff-merges=remerge` intentionally handles only two-parent
          # merges. Reject octopus (or otherwise unusual) merge commits so a
          # resolution-only secret cannot disappear from the scanner's input.
          while IFS= read -r merge_sha; do
            parent_count="$(git -C pr rev-list --parents -n 1 "$merge_sha" | awk '{print NF - 1}')"
            if [ "$parent_count" -ne 2 ]; then
              echo "::error::secret-scan gate: PR range contains a merge commit with $parent_count parents; remerge scanning supports exactly two"
              exit 1
            fi
          done < <(git -C pr rev-list --min-parents=2 "${BASE_SHA}..${HEAD_SHA}")

      - name: Scan the PR's commit range (redacted output only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --ignore-gitleaks-allow: a PR cannot suppress a finding with an
          # inline `gitleaks:allow` comment. --redact: never print the secret.
          # stderr is captured separately: gitleaks does not always turn a
          # git-log failure into a nonzero exit code, so an unexpected error
          # line is treated as a hard failure even if gitleaks itself reports
          # "no leaks found". --text prevents PR-controlled `.gitattributes`
          # from hiding content behind a binary diff. --diff-merges=remerge
          # exposes conflict-resolution-only changes without reclassifying
          # unchanged base-side content as a PR addition.
          stderr_file="$(mktemp)"
          set +e
          gitleaks detect \
            --source pr \
            --config "$GITLEAKS_CONFIG" \
            --redact \
            --ignore-gitleaks-allow \
            --verbose \
            --no-banner \
            --log-opts="--text --diff-merges=remerge ${BASE_SHA}..${HEAD_SHA}" \
            2> >(tee "$stderr_file" >&2)
          scan_exit=$?
          set -e

          if grep -qi "fatal:\|error=" "$stderr_file"; then
            echo "::error::secret-scan gate: git/gitleaks reported an error while resolving the commit range; treating as a failed scan regardless of exit code $scan_exit"
            exit 1
          fi

          if [ "$scan_exit" -ne 0 ]; then
            echo "::error::secret-scan gate: gitleaks found a leak (exit $scan_exit)"
            exit "$scan_exit"
          fi

          echo "OK: no leaks in ${BASE_SHA}..${HEAD_SHA}, and the range/stderr checks found no error."

      - name: Publish final required status on the exact PR head
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Secret scan passed"
          else
            state="failure"
            description="Secret scan failed"
          fi

          payload="$(printf \
            '{"state":"%s","context":"secret-scan","description":"%s","target_url":"%s"}' \
            "$state" "$description" "$RUN_URL")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            >/dev/null
          echo "OK: published $state secret-scan status to the exact PR head."

