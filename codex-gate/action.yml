name: Codex review gate
description: Posts the codex-review commit status (LAAA). Logic and rule in gate.mjs beside this file.
inputs:
  token:
    description: Token that can read the PR and post commit statuses and PR comments.
    required: true
  comment-token:
    description: Optional token for the one "@codex review" retry, when Codex ignores the workflow's own comments.
    required: false
    default: ""
  exempt-author:
    description: Optional bot login whose generated-data PRs pass without a review (with exempt-paths).
    required: false
    default: ""
  exempt-paths:
    description: Comma-separated path prefixes; the exempt bot's PR passes only if every changed file is under one.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/gate.mjs" --event
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        COMMENT_TOKEN: ${{ inputs.comment-token }}
        EXEMPT_AUTHOR: ${{ inputs.exempt-author }}
        EXEMPT_PATHS: ${{ inputs.exempt-paths }}
